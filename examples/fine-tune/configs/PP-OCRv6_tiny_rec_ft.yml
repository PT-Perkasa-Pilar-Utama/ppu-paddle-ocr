# Fine-tune config for PP-OCRv6 tiny recognition (the ppu-paddle-ocr default).
# Run from the PaddleOCR repo root with this kit copied in as ./fine-tune/
# (see ../README.md). Differences from the upstream training config: pretrained
# weights loaded, 10x lower LR, shorter schedule, space-aware metric, and
# max_text_length raised to 40 (upstream 25 silently drops longer labels).

Global:
  model_name: PP-OCRv6_tiny_rec
  debug: false
  use_gpu: true
  epoch_num: 50
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./fine-tune/output/tiny
  save_epoch_step: 10
  eval_batch_step: [0, 200]
  cal_metric_during_train: true
  pretrained_model: ./fine-tune/pretrained/PP-OCRv6_tiny_rec_pretrained.pdparams
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  infer_img: doc/imgs_words/ch/word_1.jpg
  character_dict_path: ppocr/utils/dict/ppocrv6_tiny_dict.txt
  max_text_length: &max_text_length 40
  infer_mode: false
  use_space_char: true
  distributed: true
  save_res_path: ./fine-tune/output/predicts_tiny.txt
  d2s_train_image_shape: [3, 48, 320]

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0001 # fine-tune: 10x lower than the from-scratch recipe
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV4
    model_size: tiny
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: reshape
          Head:
            mid_channels: 80
            use_guide: true
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 384
          max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc
  # upstream default (true) selects the best checkpoint while ignoring spaces;
  # keep spaces counted so space accuracy is part of model selection
  ignore_space: false

Train:
  dataset:
    name: MultiScaleDataSet
    ds_width: false
    data_dir: ./fine-tune/dataset/
    ext_op_transform_idx: 1
    label_file_list:
      - ./fine-tune/dataset/train.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - RecConAug:
          prob: 0.5
          ext_data_num: 2
          image_shape: [48, 320, 3]
          max_text_length: *max_text_length
      - RecAug:
      - MultiLabelEncode:
          gtc_encode: NRTRLabelEncode
      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_gtc
            - length
            - valid_ratio
  sampler:
    name: MultiScaleSampler
    scales: [[320, 32], [320, 48], [320, 64]]
    first_bs: &bs 64
    fix_bs: false
    divided_factor: [8, 16]
    is_training: True
  loader:
    shuffle: true
    batch_size_per_card: *bs
    drop_last: true
    num_workers: 4

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./fine-tune/dataset/
    label_file_list:
      - ./fine-tune/dataset/val.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - MultiLabelEncode:
          gtc_encode: NRTRLabelEncode
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_gtc
            - length
            - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 64
    num_workers: 4
