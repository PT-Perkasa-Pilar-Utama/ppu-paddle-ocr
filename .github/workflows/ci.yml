name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Quality Checks and Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned: bun 1.3.x has a recurring SIGILL/segfault on test-runner
          # exit (bun.report/1.3.13/... address 0x1A) that causes CI to fail
          # even when every test passes. 1.2.23 is the last 1.2.x and does
          # not hit this path. Bump once upstream fixes.
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Formatter check
        run: bun run fmt

      - name: Linting check
        run: bun run lint --format=github

      - name: TypeScript type check
        run: bun run type-check

      # Runs the whole suite in one process (web tests isolate their platform
      # via setPlatform save/restore) and gates on coverage (>= 90% line +
      # function, enforced by bunfig.toml's coverageThreshold).
      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Build
        run: bun run build

      # Verify the build is reproducible: build a second time and confirm the
      # output is byte-identical (OpenSSF Best Practices: build_reproducible).
      - name: Verify reproducible build
        run: |
          h1=$(find lib -type f -exec shasum {} \; | sort | shasum)
          rm -rf lib
          bun run build
          h2=$(find lib -type f -exec shasum {} \; | sort | shasum)
          if [ "$h1" != "$h2" ]; then
            echo "::error::Build is not reproducible: $h1 != $h2"
            exit 1
          fi
          echo "Build is reproducible."

      # The bin is only usable via npx/bunx if the build kept its shebang and
      # executable bit; assert both, then that it actually runs.
      - name: CLI — verify bin
        run: |
          test -x lib/cli/index.js
          head -1 lib/cli/index.js | grep -q '^#!/usr/bin/env node'
          node lib/cli/index.js --version

      # apps/serve is a standalone package (its own deps); check it separately.
      - name: Serve — install
        run: cd apps/serve && bun install --frozen-lockfile

      - name: Serve — type check
        run: cd apps/serve && bun run type-check

      - name: Serve — tests
        run: cd apps/serve && bun test

  sca:
    name: SCA (dependency vulnerabilities)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Fails the run on any vulnerable dependency, blocking the change from
      # merging once this job is a required status check.
      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=./bun.lock
