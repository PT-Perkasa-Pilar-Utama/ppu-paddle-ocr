# .github/workflows/publish.yml

name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js for npm auth
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match ci.yml: unpinned Bun 1.3.x races on ONNX session
          # teardown in the parallel test runner ("Session already disposed").
          bun-version: 1.2.23

      - name: Install dependencies
        # Frozen so install never rewrites bun.lock — a dirty tree makes the
        # `jsr publish` step below abort ("Aborting due to uncommitted changes").
        run: bun install --frozen-lockfile

      - name: Formatter check
        run: bun run fmt

      - name: Linting check
        run: bun run lint --format=github

      - name: TypeScript type check
        run: bun run type-check

      - name: Run tests with coverage
        run: bun run test --coverage

      - name: Publish package to jsr
        run: bunx jsr publish

      - name: Build
        run: bun run build

      - name: Copy package files
        run: cp README.md package.json lib/

      # Guard the bin before it ships: it must run and be in the tarball, or
      # `npx ppu-paddle-ocr` breaks for everyone.
      - name: Verify CLI bin is runnable and packed
        run: |
          node lib/cli/index.js --version
          npm pack ./lib --dry-run 2>&1 | grep -q 'cli/index.js'

      - name: Publish to npm
        run: npm publish ./lib --access=public
