# .github/workflows/publish.yml

name: Publish

on:
  release:
    types: [published]
  # Manual trigger for re-publishing (e.g. jsr fell behind npm). Runs against
  # the selected ref; the npm step skips versions already published and the
  # release-asset steps are skipped when there is no release context.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the SBOM to the GitHub release
      id-token: write # npm provenance + jsr OIDC
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js for npm auth
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned to match ci.yml: unpinned Bun 1.3.x races on ONNX session
          # teardown in the parallel test runner ("Session already disposed").
          # Pinned to 1.3.14: bun 1.2.23 on linux mis-handles opencv-js 5's
          # Promise-based init when the node and web entries load in one
          # process (cv ends up without its JS helpers -> every opencv OCR
          # returns empty). The earlier 1.3.13 SIGILL-on-exit that forced the
          # 1.2.23 pin no longer reproduces on 1.3.14.
          bun-version: 1.3.14

      - name: Install dependencies
        # Frozen so install never rewrites bun.lock — a dirty tree makes the
        # `jsr publish` step below abort ("Aborting due to uncommitted changes").
        run: bun install --frozen-lockfile

      # The test step runs the whole repo, including apps/serve (a standalone
      # package with its own deps); install them first so they resolve.
      - name: Install serve dependencies
        run: cd apps/serve && bun install --frozen-lockfile

      # Block the release on any High/Critical advisory in a dependency.
      # Mirrors the SCA gate that runs on every PR in ci.yml.
      - name: SCA scan (block on vulnerable dependencies)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=./bun.lock

      - name: Formatter check
        run: bun run fmt

      - name: Linting check
        run: bun run lint --format=github

      - name: TypeScript type check
        run: bun run type-check

      # Pinned bun 1.2.23 caps lifecycle-hook timeouts at the 5 s default, and
      # the web tests read the v6 models straight from ~/.cache. Warm the cache
      # here (default v6 + the v5 EN models the dictionary tests use) so the
      # in-hook downloads are fast disk hits — mirrors ci.yml.
      - name: Warm model cache
        run: bun scripts/warm-test-models.ts

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Publish package to jsr
        run: bunx jsr publish

      - name: Build
        run: bun run build

      # Writes README + a sanitized package.json (no scripts/devDependencies)
      # into lib/ so the published package can run no install lifecycle code.
      - name: Prepare publish manifest
        run: bun task prepare-publish

      # Guard the bin before it ships: it must run and be in the tarball, or
      # `npx ppu-paddle-ocr` breaks for everyone.
      - name: Verify CLI bin is runnable and packed
        run: |
          node lib/cli/index.js --version
          npm pack ./lib --dry-run 2>&1 | grep -q 'cli/index.js'

      # --provenance is auto-generated by OIDC trusted publishing, but passing
      # it explicitly makes a misconfigured publisher fail loudly instead of
      # silently shipping without an attestation.
      - name: Publish to npm
        run: |
          ver=$(node -p "require('./lib/package.json').version")
          if npm view "ppu-paddle-ocr@$ver" version >/dev/null 2>&1; then
            echo "ppu-paddle-ocr@$ver already published to npm, skipping."
          else
            npm publish ./lib --access=public --provenance
          fi

      # Generate a CycloneDX SBOM and attach it to the GitHub release so
      # consumers can audit each version's dependency set.
      - name: Generate and attach SBOM
        if: github.event_name == 'release'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          artifact-name: ppu-paddle-ocr-sbom.cyclonedx.json
          output-file: ppu-paddle-ocr-sbom.cyclonedx.json
          upload-release-assets: true

      # Pack the exact published tarball so it can be signed and attached to the
      # GitHub release. OpenSSF Scorecard's Signed-Releases check reads release
      # assets for a signature/provenance file (npm provenance is not visible to
      # it), so we attach a cosign Sigstore bundle per release.
      - name: Pack published tarball
        if: github.event_name == 'release'
        run: npm pack ./lib --pack-destination "$RUNNER_TEMP"

      - name: Install cosign
        if: github.event_name == 'release'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing via OIDC (Sigstore/Fulcio) — no long-lived keys; uses the
      # id-token: write permission. cosign 3.x emits one .sigstore.json bundle
      # (signature + Fulcio cert + Rekor entry); Scorecard recognizes the suffix.
      - name: Sign the tarball (keyless)
        if: github.event_name == 'release'
        env:
          COSIGN_YES: "true"
        run: |
          for f in "$RUNNER_TEMP"/*.tgz; do
            cosign sign-blob "$f" --bundle "$f.sigstore.json"
          done

      - name: Attach signed artifacts to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "$RUNNER_TEMP"/*.tgz "$RUNNER_TEMP"/*.tgz.sigstore.json \
            --repo "${{ github.repository }}" --clobber
