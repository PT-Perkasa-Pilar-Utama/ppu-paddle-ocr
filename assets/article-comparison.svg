<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 488" role="img" aria-label="OCR comparison: ppu-paddle-ocr vs official PaddleOCR SDK, Tesseract.js, and LLM OCR">
  <rect width="980" height="488" fill="#0b1020"/>
  <g font-family="Inter, system-ui, sans-serif" fill="#e2e8f0">

    <text x="40" y="46" font-size="22" font-weight="700">Choosing an OCR engine for JavaScript</text>
    <text x="40" y="70" font-size="13" fill="#94a3b8">Same input: a receipt photo. Different trade-offs.</text>

    <!-- Header row -->
    <g transform="translate(40,100)">
      <rect x="0" y="0" width="220" height="44" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="16" y="28" font-size="13" fill="#94a3b8">Property</text>

      <rect x="230" y="0" width="170" height="44" rx="8" fill="#0f172a" stroke="#22d3ee"/>
      <text x="246" y="28" font-size="13" font-weight="700" fill="#5eead4">ppu-paddle-ocr</text>

      <rect x="410" y="0" width="170" height="44" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="426" y="28" font-size="13" fill="#cbd5e1">Official PaddleOCR JS</text>

      <rect x="590" y="0" width="150" height="44" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="606" y="28" font-size="13" fill="#cbd5e1">Tesseract.js</text>

      <rect x="750" y="0" width="180" height="44" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="766" y="28" font-size="13" fill="#cbd5e1">LLM OCR (API)</text>
    </g>

    <!-- Rows -->
    <g transform="translate(40,160)" font-size="13">
      <!-- row 1 -->
      <g>
        <text x="16" y="22" fill="#cbd5e1">Deterministic output</text>
        <text x="246" y="22" fill="#5eead4">Yes</text>
        <text x="426" y="22" fill="#5eead4">Yes</text>
        <text x="606" y="22" fill="#5eead4">Yes</text>
        <text x="766" y="22" fill="#fca5a5">No (stochastic)</text>
      </g>
      <line x1="0" y1="40" x2="900" y2="40" stroke="#1e293b"/>

      <!-- row 2 -->
      <g transform="translate(0,46)">
        <text x="16" y="22" fill="#cbd5e1">Runs in Node.js</text>
        <text x="246" y="22" fill="#5eead4">Yes</text>
        <text x="426" y="22" fill="#fca5a5">Browser only</text>
        <text x="606" y="22" fill="#5eead4">Yes</text>
        <text x="766" y="22" fill="#cbd5e1">Via HTTP</text>
      </g>
      <line x1="0" y1="86" x2="900" y2="86" stroke="#1e293b"/>

      <!-- row 3 -->
      <g transform="translate(0,92)">
        <text x="16" y="22" fill="#cbd5e1">Runs in Bun / Deno</text>
        <text x="246" y="22" fill="#5eead4">Yes</text>
        <text x="426" y="22" fill="#fca5a5">No</text>
        <text x="606" y="22" fill="#facc15">Partial</text>
        <text x="766" y="22" fill="#cbd5e1">Via HTTP</text>
      </g>
      <line x1="0" y1="132" x2="900" y2="132" stroke="#1e293b"/>

      <!-- row 4 -->
      <g transform="translate(0,138)">
        <text x="16" y="22" fill="#cbd5e1">Offline / on-device</text>
        <text x="246" y="22" fill="#5eead4">Yes</text>
        <text x="426" y="22" fill="#5eead4">Yes</text>
        <text x="606" y="22" fill="#5eead4">Yes</text>
        <text x="766" y="22" fill="#fca5a5">No</text>
      </g>
      <line x1="0" y1="178" x2="900" y2="178" stroke="#1e293b"/>

      <!-- row 5 -->
      <g transform="translate(0,184)">
        <text x="16" y="22" fill="#cbd5e1">WebGPU acceleration</text>
        <text x="246" y="22" fill="#5eead4">Yes</text>
        <text x="426" y="22" fill="#facc15">WASM</text>
        <text x="606" y="22" fill="#facc15">WASM</text>
        <text x="766" y="22" fill="#94a3b8">N/A</text>
      </g>
      <line x1="0" y1="224" x2="900" y2="224" stroke="#1e293b"/>

      <!-- row 6 -->
      <g transform="translate(0,230)">
        <text x="16" y="22" fill="#cbd5e1">Model family</text>
        <text x="246" y="22" fill="#cbd5e1">PP-OCRv5</text>
        <text x="426" y="22" fill="#cbd5e1">PP-OCRv4</text>
        <text x="606" y="22" fill="#cbd5e1">LSTM (legacy)</text>
        <text x="766" y="22" fill="#cbd5e1">Closed LLM</text>
      </g>
      <line x1="0" y1="270" x2="900" y2="270" stroke="#1e293b"/>

      <!-- row 7 -->
      <g transform="translate(0,276)">
        <text x="16" y="22" fill="#cbd5e1">Cost per 1k images</text>
        <text x="246" y="22" fill="#5eead4">$0</text>
        <text x="426" y="22" fill="#5eead4">$0</text>
        <text x="606" y="22" fill="#5eead4">$0</text>
        <text x="766" y="22" fill="#fca5a5">$$$</text>
      </g>
      <line x1="0" y1="316" x2="900" y2="316" stroke="#1e293b"/>

      <!-- row 8 -->
      <g transform="translate(0,322)">
        <text x="16" y="22" fill="#cbd5e1">Production dependencies</text>
        <text x="246" y="22" fill="#5eead4">1 (+ optional ORT)</text>
        <text x="426" y="22" fill="#facc15">paddlejs core</text>
        <text x="606" y="22" fill="#facc15">core + workers</text>
        <text x="766" y="22" fill="#cbd5e1">SDK client</text>
      </g>
    </g>
  </g>
</svg>
