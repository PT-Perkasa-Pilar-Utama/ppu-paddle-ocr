<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 260" role="img" aria-label="ppu-paddle-ocr pipeline: image to detection boxes to recognition to text">
  <rect width="980" height="260" fill="#0b1020"/>
  <g font-family="Inter, system-ui, sans-serif" fill="#e2e8f0">

    <!-- Stage 1: image -->
    <g transform="translate(40,70)">
      <rect width="180" height="120" rx="10" fill="#0f172a" stroke="#1e293b"/>
      <text x="20" y="32" font-size="14" font-weight="600">1. Image</text>
      <text x="20" y="56" font-size="12" fill="#94a3b8">Buffer · URL · Canvas</text>
      <g transform="translate(20,72)" fill="#1e3a8a">
        <rect width="140" height="34" rx="4" opacity="0.5"/>
        <rect y="2" width="120" height="4" rx="2" fill="#5eead4"/>
        <rect y="12" width="100" height="4" rx="2" fill="#5eead4"/>
        <rect y="22" width="130" height="4" rx="2" fill="#5eead4"/>
      </g>
    </g>

    <path d="M220 130 L260 130" stroke="#5eead4" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Stage 2: detection -->
    <g transform="translate(260,70)">
      <rect width="200" height="120" rx="10" fill="#0f172a" stroke="#22d3ee"/>
      <text x="20" y="32" font-size="14" font-weight="600">2. Detection</text>
      <text x="20" y="56" font-size="12" fill="#94a3b8">PP-OCRv5 det · ONNX</text>
      <g transform="translate(20,72)">
        <rect width="160" height="34" rx="3" fill="#1e3a8a" opacity="0.3"/>
        <rect x="6" y="6" width="40" height="10" stroke="#5eead4" fill="none"/>
        <rect x="54" y="6" width="60" height="10" stroke="#5eead4" fill="none"/>
        <rect x="6" y="20" width="80" height="10" stroke="#5eead4" fill="none"/>
        <rect x="94" y="20" width="50" height="10" stroke="#5eead4" fill="none"/>
      </g>
    </g>

    <path d="M460 130 L500 130" stroke="#5eead4" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Stage 3: strategy -->
    <g transform="translate(500,70)">
      <rect width="200" height="120" rx="10" fill="#0f172a" stroke="#a78bfa"/>
      <text x="20" y="32" font-size="14" font-weight="600">3. Strategy</text>
      <text x="20" y="56" font-size="12" fill="#94a3b8">per-box · per-line</text>
      <text x="20" y="72" font-size="12" fill="#94a3b8">cross-line bin-packed</text>
      <g transform="translate(20,84)">
        <rect width="60" height="20" rx="3" fill="#312e81"/>
        <rect x="66" width="60" height="20" rx="3" fill="#312e81"/>
        <rect y="24" width="126" height="14" rx="3" fill="#a78bfa" opacity="0.4"/>
      </g>
    </g>

    <path d="M700 130 L740 130" stroke="#5eead4" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Stage 4: recognition -->
    <g transform="translate(740,70)">
      <rect width="200" height="120" rx="10" fill="#0f172a" stroke="#5eead4"/>
      <text x="20" y="32" font-size="14" font-weight="600">4. Text</text>
      <text x="20" y="56" font-size="12" fill="#94a3b8">PP-OCRv5 rec · INT8</text>
      <g transform="translate(20,72)" font-family="JetBrains Mono, monospace" font-size="11" fill="#5eead4">
        <text y="12">Total       42.50</text>
        <text y="28">Tax          3.40</text>
        <text y="44">Cashier  #12</text>
      </g>
    </g>

    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#5eead4"/>
      </marker>
    </defs>

    <text x="40" y="40" font-size="18" font-weight="700">Pipeline: image to text in four stages</text>
    <text x="40" y="232" font-size="12" fill="#94a3b8">Every stage is deterministic. Same input, same output. No prompt drift, no token cost.</text>
  </g>
</svg>
